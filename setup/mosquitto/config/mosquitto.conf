# Eclipse Mosquitto MQTT Broker Configuration for Maggot Monitoring
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener (Opsional untuk Client Web)
listener 9001 0.0.0.0
protocol websockets

# Persistence Data Storage
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
