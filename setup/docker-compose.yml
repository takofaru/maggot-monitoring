services:
  # 1. Aplikasi Utama Maggot Monitoring (PHP 8.3 + Nginx + Reverb + MQTT Daemon + Queue Worker)
  app:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    container_name: maggot_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "8085:8085"
    environment:
      APP_NAME: "Maggot Monitoring"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: maggot-db
      DB_USERNAME: maggot_user
      DB_PASSWORD: maggot_secure_password
      
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "344853"
      REVERB_APP_KEY: "esqntyvtebpbanvf1ihg"
      REVERB_APP_SECRET: "j4w7qerwwniknhi1v7yt"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8085"
      REVERB_SERVER_PORT: "8085"
      REVERB_SCHEME: "http"

      VITE_REVERB_APP_KEY: "esqntyvtebpbanvf1ihg"
      VITE_REVERB_HOST: "localhost"
      VITE_REVERB_PORT: "8085"
      VITE_REVERB_SCHEME: "http"

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - mysql
      - mosquitto
    networks:
      - maggot_network

  # 2. Database Server MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: maggot_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maggot-db
      MYSQL_USER: maggot_user
      MYSQL_PASSWORD: maggot_secure_password
      MYSQL_ROOT_PASSWORD: maggot_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - maggot_network

  # 3. MQTT Broker Eclipse Mosquitto (Untuk Telemetri Sensor ESP32 IoT)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: maggot_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - maggot_network

volumes:
  db_data:
    name: maggot_db_data
  app_storage:
    name: maggot_app_storage
  mosquitto_data:
    name: maggot_mosquitto_data
  mosquitto_log:
    name: maggot_mosquitto_log

networks:
  maggot_network:
    name: maggot_network
    driver: bridge
